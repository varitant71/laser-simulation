<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>레이저 반사 시뮬레이션</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>레이저 반사 시뮬레이션</h1>
      <p class="subtitle">
        A(0,0)에서 45°로 출발한 빛이 사각형 ABCD 벽면에서 반사됩니다.
      </p>
    </header>

    <main class="layout">
      <section class="panel reference">
        <h2>문제 그림</h2>
        <img
          src="assets/IMG_2656.png"
          alt="레이저 반사 문제 — 사각형 ABCD와 45도 경로"
          class="reference-img"
        />
      </section>

      <section class="panel controls">
        <h2>설정</h2>
        <div class="field-row">
          <label for="inputM">가로 M</label>
          <input type="number" id="inputM" min="1" max="200" value="12" />
        </div>
        <div class="field-row">
          <label for="inputN">세로 N</label>
          <input type="number" id="inputN" min="1" max="200" value="4" />
        </div>
        <div class="field-row">
          <label for="speedRange">재생 속도</label>
          <input type="range" id="speedRange" min="1" max="10" value="5" />
          <span id="speedLabel">5</span>
        </div>
        <p id="inputError" class="error" hidden></p>
        <div class="button-row">
          <button type="button" id="btnStart" class="btn primary">Start</button>
          <button type="button" id="btnStop" class="btn" disabled>Stop</button>
          <button type="button" id="btnReset" class="btn">격자만 다시 그리기</button>
        </div>
      </section>

      <section class="panel simulation">
        <h2>시뮬레이션</h2>
        <div class="canvas-wrap">
          <canvas id="gridCanvas" width="800" height="480"></canvas>
        </div>
        <div id="resultPanel" class="result">
          <p id="resultStatus">M, N을 입력한 뒤 Start를 눌러 주세요.</p>
          <p id="resultDetail" class="detail"></p>
          <p id="resultHint" class="hint"></p>
        </div>
      </section>
    </main>

    <script src="laser.js"></script>
  </body>
</html>
